# Keep-feature package tests for Turbo (isolation, game mode, disk, reporting).
# PR/push gate so sync merges cannot silently regress fork surfaces.
name: keep-features

on:
  push:
    branches: [dev, main, "sync/**"]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "16777216"

permissions:
  contents: read

jobs:
  keep-features:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: "1.93.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-features

      # Every cargo invocation below builds xai-grok-tools-api, whose build.rs
      # compiles protos. `find_protoc` resolves $PROTOC, else the repo's
      # `bin/protoc` dotslash wrapper -- which cannot run without dotslash, so
      # this job died in the first build script and every step after it was
      # skipped. release.yml already installs this; keep-features never did,
      # which is why the gate was red rather than useful.
      - name: Install dotslash (protoc launcher)
        run: cargo install dotslash --version 0.5.7 --locked

      - name: Isolation / subagents
        run: |
          cargo test -p xai-grok-tools --lib spawn_queues -- --test-threads=2
          cargo test -p xai-grok-tools --lib subagent_worktree -- --test-threads=2
          cargo test -p xai-grok-shell --lib live_worktree -- --test-threads=2
          cargo test -p xai-grok-shell --lib prune_soft_preserved -- --test-threads=2

      - name: Game mode + disk CLI
        run: |
          cargo test -p xai-grok-pager --lib views::game_mode -- --test-threads=2
          cargo test -p xai-grok-pager --lib disk_cmd -- --test-threads=2

      - name: Meeting notetaker (join URL, guest bot, CDP)
        run: |
          cargo test -p xai-grok-meetings --lib -- --test-threads=2
          cargo test -p xai-grok-meeting-bot --lib -- --test-threads=2
          cargo test -p xai-grok-cdp --lib -- --test-threads=2

      - name: MCP server containment boundary
        run: |
          # The grep tests need a real ripgrep; debug builds do not bundle one.
          sudo apt-get update && sudo apt-get install -y ripgrep
          rg --version
          cargo test -p xai-grok-mcp-server --lib -- --test-threads=2
          cargo test -p xai-grok-pager --lib mcp_serve_cmd -- --test-threads=2

      - name: Agent reporting (ADL/FRL + tools schema)
        run: |
          cargo test -p xai-grok-developer-log --lib -- --test-threads=2
          cargo test -p xai-grok-agent --lib boot_card -- --test-threads=2
          cargo test -p xai-grok-pager --lib tools_cmd -- --test-threads=2

  # The session-folder DACL, junction and letter-case tests only run on Windows.
  mcp-server-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: "1.93.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-features-windows

      # Windows cannot exec the Unix dotslash launcher at bin/protoc (os error
      # 193) even with dotslash installed, so this job's first runs died in
      # the xai-grok-tools-api build script before any test ran. Install a
      # real protoc.exe and point $PROTOC at it: find_protoc checks $PROTOC
      # before bin/protoc, and the zip's include/ dir supplies the well-known
      # types. Copied verbatim from release.yml (minus its runner.os guard);
      # keep the URL and SHA256 in sync. No dotslash install here: bin/protoc
      # is the repo's only dotslash launcher, and $PROTOC bypasses it.
      - name: Install protoc (Windows)
        shell: pwsh
        run: |
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip"
          $expectedSha256 = "57ea59e9f551ad8d71ffaa9b5cfbe0ca1f4e720972a1db7ec2d12ab44bff9383"
          Invoke-WebRequest -Uri $url -OutFile protoc.zip
          $actualSha256 = (Get-FileHash protoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "protoc.zip SHA256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive protoc.zip -DestinationPath "$env:USERPROFILE\protoc" -Force
          $protoc = Join-Path $env:USERPROFILE "protoc\bin\protoc.exe"
          if (-not (Test-Path $protoc)) { throw "protoc.exe missing at $protoc" }
          & $protoc --version
          Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE "protoc\bin")
          Add-Content $env:GITHUB_ENV "PROTOC=$protoc"

      - name: MCP server containment boundary (Windows)
        shell: bash
        run: |
          choco install ripgrep -y --no-progress
          rg --version
          cargo test -p xai-grok-mcp-server --lib -- --test-threads=2
