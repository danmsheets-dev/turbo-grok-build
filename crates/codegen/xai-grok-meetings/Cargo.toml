[package]
name = "xai-grok-meetings"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Fathom-style meeting notetaker: URL parse, transcript store, note prompts"
publish = false

[dependencies]
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
