[package]
name = "xai-grok-meeting-bot"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Self-hosted Teams guest notetaker: joins as a bot participant, taps meeting audio and chat"
publish = false

[dependencies]
futures-util = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
xai-grok-cdp = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
