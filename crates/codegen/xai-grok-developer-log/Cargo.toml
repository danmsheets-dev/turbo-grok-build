[package]
license = "Apache-2.0"
edition.workspace = true
name = "xai-grok-developer-log"
version = "0.1.0"
description = "Auto Developer Log — structured product-issue store for Turbo agents and maintainers"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
xai-grok-config = { workspace = true }
xai-grok-secrets = { workspace = true }
xai-grok-version = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
